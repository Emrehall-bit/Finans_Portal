parent=keycloak
import=common/keycloak

# Load parent PatternFly base (layout/form wiring) then our visual overrides.
styles=css/login.css css/finance-portal.css
scripts=js/finance-portal-login.js

# Supported locales — must match realm internationalizationEnabled + supportedLocales.
locales=tr,en

# ── Dev tip ────────────────────────────────────────────────────────────────────
# Keycloak caches themes in production mode. In start-dev (docker-compose) mode
# caching is already disabled automatically — no extra flag needed.
# If you ever switch to production mode and need to hot-reload theme changes, add
# this flag to the Keycloak command in docker-compose.yml:
#   --spi-theme-static-max-age=-1
#   --spi-theme-cache-themes=false
#   --spi-theme-cache-dynamic=false
# After any change to this file or CSS/FTL files, restart Keycloak:
#   docker compose -f infra/docker-compose.yml restart keycloak
# ──────────────────────────────────────────────────────────────────────────────
