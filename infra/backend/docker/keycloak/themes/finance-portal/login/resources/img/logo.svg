<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Rounded square background -->
  <rect width="48" height="48" rx="12" fill="#4c7fff"/>
  <!-- Upward trend line -->
  <polyline
    points="10,34 18,24 25,28 38,13"
    fill="none"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <!-- Dot at trend tip -->
  <circle cx="38" cy="13" r="3.5" fill="white"/>
  <!-- Subtle base line -->
  <line x1="9" y1="37" x2="39" y2="37" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
