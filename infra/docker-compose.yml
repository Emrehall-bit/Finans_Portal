services:
  redis:
    image: redis:7
    container_name: finance_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  openldap:
    image: osixia/openldap:1.5.0
    container_name: finance_portal_openldap
    environment:
      LDAP_ORGANISATION: "Finance Portal"
      LDAP_DOMAIN: financeportal.local
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-ldapadmin123}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: readonly
      LDAP_READONLY_USER_PASSWORD: ${LDAP_READONLY_PASSWORD:-ldapreadonly123}
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
      - ./backend/docker/openldap/ldifs:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    command: ["--loglevel", "warning", "--copy-service"]
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -D 'cn=admin,dc=financeportal,dc=local' -w \"$$LDAP_ADMIN_PASSWORD\" -b 'dc=financeportal,dc=local' -s base 2>&1 | grep -q 'result: 0'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: finance_portal_postgres
    environment:
      POSTGRES_DB: financeportaldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - finance_portal_pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financeportaldb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak-db-init:
    image: postgres:16
    container_name: finance_portal_keycloak_db_init
    environment:
      PGPASSWORD: postgres
    command:
      - sh
      - -c
      - >
        until pg_isready -h postgres -U postgres -d postgres; do sleep 2; done &&
        psql -h postgres -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" |
        grep -q 1 ||
        psql -h postgres -U postgres -d postgres -c "CREATE DATABASE keycloak"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: finance_portal_keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./backend/docker/keycloak/realm-import:/opt/keycloak/data/import
      - ./backend/docker/keycloak/providers:/opt/keycloak/providers
      - ./backend/docker/keycloak/themes:/opt/keycloak/themes
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
      openldap:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: finance_portal_backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/financeportaldb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/finance-portal
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/finance-portal/protocol/openid-connect/certs
      LOG_PATH: /var/log/finance-portal
    ports:
      - "8080:8080"
    volumes:
      - ../backend/logs:/var/log/finance-portal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: finance_portal_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

  opensearch-init:
    image: curlimages/curl:latest
    container_name: finance-portal-opensearch-init
    volumes:
      - ./observability/opensearch/finance-portal-logs-template.json:/tmp/finance-portal-logs-template.json:ro
    command: >
      sh -c "
        until curl -sf http://opensearch:9200/_cluster/health > /dev/null; do
          echo 'Waiting for OpenSearch...';
          sleep 5;
        done &&
        curl -s -X PUT http://opensearch:9200/_index_template/finance-portal-logs-template
          -H 'Content-Type: application/json'
          --data-binary @/tmp/finance-portal-logs-template.json &&
        echo 'OpenSearch index template applied.'
      "
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: finance-portal-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: finance-portal-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: finance-portal-opensearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_SECURITY_PLUGIN: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: finance-portal-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      - opensearch
    restart: unless-stopped

  fluent-bit:
    image: fluent/fluent-bit:latest
    container_name: finance-portal-fluent-bit
    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ../backend/logs:/var/log/finance-portal:ro
      - fluent_bit_state:/fluent-bit/state
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    container_name: finance-portal-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:latest
    container_name: finance-portal-kafka-init
    command:
      - sh
      - -c
      - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic finance-portal-logs --partitions 3 --replication-factor 1 --config retention.ms=604800000 && echo 'Topic finance-portal-logs created.'"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-log-consumer:
    build:
      context: ./kafka-log-consumer
    container_name: finance-portal-kafka-log-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: finance-portal-logs
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_PREFIX: finance-portal-logs
      BULK_SIZE: "100"
      FLUSH_INTERVAL_SEC: "5"
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: finance-portal-kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: finance-portal
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  finance_portal_pgdata:
  openldap_data:
  openldap_config:
  prometheus_data:
  grafana_data:
  opensearch_data:
  fluent_bit_state:
  kafka_data:

