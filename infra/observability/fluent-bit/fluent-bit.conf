[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf
    storage.path /fluent-bit/state

[INPUT]
    Name              tail
    Path              /var/log/finance-portal/application.log
    Tag               finance.portal.application
    Parser            json
    DB                /fluent-bit/state/fluent-bit-finance-portal-application.db
    Read_from_Head    On
    Refresh_Interval  5
    Skip_Long_Lines   On
    Rotate_Wait       30
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Path              /var/log/finance-portal/access.log
    Tag               finance.portal.access
    Parser            json
    DB                /fluent-bit/state/fluent-bit-finance-portal-access.db
    Read_from_Head    On
    Refresh_Interval  1
    Skip_Long_Lines   On
    Rotate_Wait       30
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Path              /var/log/finance-portal/error.log
    Tag               finance.portal.error
    Parser            json
    DB                /fluent-bit/state/fluent-bit-finance-portal-error.db
    Read_from_Head    On
    Refresh_Interval  5
    Skip_Long_Lines   On
    Rotate_Wait       30
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Path              /var/log/finance-portal/audit.log
    Tag               finance.portal.audit
    Parser            json
    DB                /fluent-bit/state/fluent-bit-finance-portal-audit.db
    Read_from_Head    On
    Refresh_Interval  5
    Skip_Long_Lines   On
    Rotate_Wait       30
    Mem_Buf_Limit     10MB

[INPUT]
    Name              tail
    Path              /var/log/finance-portal/scheduler.log
    Tag               finance.portal.scheduler
    Parser            json
    DB                /fluent-bit/state/fluent-bit-finance-portal-scheduler.db
    Read_from_Head    On
    Refresh_Interval  5
    Skip_Long_Lines   On
    Rotate_Wait       30
    Mem_Buf_Limit     10MB

[FILTER]
    Name          parser
    Match         finance.portal.*
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  Off

[FILTER]
    Name          modify
    Match         finance.portal.application
    Add           service finance-portal-backend
    Add           log_type application

[FILTER]
    Name          modify
    Match         finance.portal.access
    Add           service finance-portal-backend
    Add           log_type access

[FILTER]
    Name          modify
    Match         finance.portal.error
    Add           service finance-portal-backend
    Add           log_type error

[FILTER]
    Name          modify
    Match         finance.portal.audit
    Add           service finance-portal-backend
    Add           log_type audit

[FILTER]
    Name          modify
    Match         finance.portal.scheduler
    Add           service finance-portal-backend
    Add           log_type scheduler

[OUTPUT]
    Name                opensearch
    Match               finance.portal.*
    Host                opensearch
    Port                9200
    Index               finance-portal-logs
    Logstash_Format     On
    Logstash_Prefix     finance-portal-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Write_Operation     index
    Trace_Error         On
