global:
  scrape_interval: 10s
  evaluation_interval: 10s


rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: finance-portal-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080  # TODO(docker-gecis): backend:8080 yap

