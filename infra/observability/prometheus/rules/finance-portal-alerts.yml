groups:
  - name: finance-portal-backend
    rules:
      - alert: BackendDown
        expr: up{job="finance-portal-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: finance-portal-backend
        annotations:
          summary: Finance Portal backend is down
          description: Prometheus cannot scrape the backend metrics endpoint for more than 1 minute.

      - alert: HighApiResponseTime
        expr: |
          (
            sum(rate(http_server_requests_seconds_sum[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
          service: finance-portal-backend
        annotations:
          summary: High API response time
          description: Average API response time is above 2 seconds for 5 minutes.

      - alert: Http5xxSpike
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0
        for: 2m
        labels:
          severity: warning
          service: finance-portal-backend
        annotations:
          summary: HTTP 5xx spike detected
          description: Backend 5xx response rate is above 0 requests per second.

      - alert: JvmHeapHigh
        expr: |
          (
            sum(jvm_memory_used_bytes{area="heap"})
            /
            sum(jvm_memory_max_bytes{area="heap"})
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          service: finance-portal-backend
        annotations:
          summary: JVM heap usage is high
          description: JVM heap usage is above 85 percent for 5 minutes.

      - alert: HikariPendingConnections
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
          service: finance-portal-backend
        annotations:
          summary: Hikari pending connections detected
          description: Hikari has pending database connections for more than 2 minutes.
