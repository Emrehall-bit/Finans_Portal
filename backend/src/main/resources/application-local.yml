market:
  providers:
    tcmb:
      base-url: https://evds3.tcmb.gov.tr/igmevdsms-dis
      api-key: ${TCMB_API_KEY:}
      start-date: 01-01-2000
      end-date: 01-01-2999
      current-sync-enabled: true
      current-sync-fixed-rate-ms: 3600000
      startup-backfill-enabled: true
      historical-scheduler-enabled: false

    binance:
      base-url: https://api.binance.com/api/v3
    yahoo:
      base-url: https://query1.finance.yahoo.com
    bist:
      base-url: https://datastore.borsaistanbul.com
    tefas:
      base-url: https://www.tefas.gov.tr
  scheduler:
    crypto-rate-ms: 600000
    fund-cron: "0 30 18 * * MON-FRI"
    stock-rate-ms: 1800000
    futures-cron: "0 0 19 * * MON-FRI"
    bond-cron: "0 0 19 * * MON-FRI"
  cache:
    ttl-minutes:
      fx: 40
      crypto: 8
      fund: 1500
      stock: 40
      futures: 1500
      bond: 1500

ai:
  enabled: true
  timeout-seconds: 15
  max-output-tokens: 1024
  groq:
    enabled: true
    api-key: ${GROQ_API_KEY:}
    model: llama-3.3-70b-versatile
  gemini:
    enabled: true
    api-key: ${GEMINI_API_KEY:}
    model: gemini-2.5-flash-lite
  routing:
    chat:
      primary: GEMINI
      fallback: GROQ
    page-analysis:
      primary: GROQ
      fallback: GEMINI
    technical-analysis:
      primary: GROQ
      fallback: GEMINI
    fundamental-analysis:
      primary: GROQ
      fallback: GEMINI
    news-summary:
      primary: GROQ
      fallback: GEMINI

news:
  providers:
    kap:
      scheduler-enabled: true
      startup-sync-enabled: true
      fetch-detail-enabled: true

app:
  logging:
    path: ${LOG_PATH:logs}

logging:
  level:
    com.emrehalli.financeportal: DEBUG
