spring:
  application:
    name: finance-portal-backend
  profiles:
    default: local



  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financeportaldb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 86400000 # 24 saat (millisecond)
      key-prefix: "fp:cache:"
      use-key-prefix: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect



  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/finance-portal}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/finance-portal/protocol/openid-connect/certs}

logging:
  level:
    com.emrehalli.financeportal.market: DEBUG
    com.emrehalli.financeportal.market.provider.evds: DEBUG
    com.emrehalli.financeportal.news.provider.finnhub.client: DEBUG
    com.emrehalli.financeportal.news.provider.aa: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: finance-portal-backend

market:
  sources:
    tcmb-xml:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
      enabled: true
    tcmb-evds:
      url: https://evds2.tcmb.gov.tr/service/evds
      api-key: ${TCMB_EVDS_KEY:}
      enabled: false
    finnhub:
      url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_KEY:${FINNHUB_API_KEY:d7laeepr01qm7o0b5dt0d7laeepr01qm7o0b5dtg}}
      enabled: true
      stock-symbols: ["IS:THYAO","IS:GARAN","IS:AKBNK","IS:EREGL","IS:KCHOL"]
      commodity-symbols: ["OANDA:XAU_USD","OANDA:XAG_USD"]
    newsapi:
      url: https://newsapi.org/v2
      api-key: ${NEWS_API_KEY:}
      enabled: true
  scheduler:
    currency-cron: "0 */10 * * * *"
    stock-cron: "0 */10 * * * *"
    fund-cron: "0 0 18 * * *"
  cache:
    ttl:
      BINANCE: 2m
      BIST: 15m
      EVDS: 6h
      ALL: 30m
