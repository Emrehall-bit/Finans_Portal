  provider-clients:
    bist:
      enabled: true
      provider-mode: YAHOO_LOW_FREQUENCY
      batch-size: 10
      request-delay-ms: 1500
      cooldown-minutes-on-rate-limit: 60
      yahoo:
        enabled: true
        base-url: https://query1.finance.yahoo.com
      delayed:
        enabled: false
    binance:
      enabled: true
      base-url: https://api.binance.com
    evds:
      enabled: true
      api:
        key: Rb7ROmhyOC
        url: https://evds3.tcmb.gov.tr/igmevdsms-dis
      history:
        scheduler-lookback-days: 7
        backfill-default-days: 365

  providers:
    circuit-breaker:
      sliding-window-size: 5
      failure-rate-threshold: 60
      wait-duration-open-state-seconds: 30
      permitted-calls-in-half-open-state: 2

  history:
    backfill:
      enabled: true
      min-data-points: 100
      interval-hours: 24
      default-lookback-days: 365



  refresh:
    initial-delay-ms: 0
    scheduler-delay-ms: 300000
    providers:
      bist:
        enabled: true
        refresh-minutes: 30
      binance:
        enabled: true
        refresh-minutes: 1
      evds:
        enabled: true
        refresh-minutes: 15


finnhub:
  enabled: true
  api:
    url: https://finnhub.io/api/v1
    key: ${FINNHUB_API_KEY:d7laeepr01qm7o0b5dt0d7laeepr01qm7o0b5dtg}
  sync:
    default-days-back: 3

news:
  providers:
    aa:
      enabled: true
      rss-url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
      default-category: ECONOMY
      default-language: tr
      default-region-scope: TR
    investing:
      enabled: true
      rss-url: ${INVESTING_RSS_URL:https://www.investing.com/rss/news_14.rss}
      default-category: ECONOMY
      default-language: en
      default-region-scope: GLOBAL
    kap:
      enabled: true
      base-url: https://www.kap.org.tr
      default-category: DISCLOSURE
      default-language: tr
      default-region-scope: TR
      max-items: 25
