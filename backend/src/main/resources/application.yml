spring:
  application:
    name: finance-portal-backend
  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financeportaldb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 86400000 # 24 saat (millisecond)
      key-prefix: "fp:cache:"
      use-key-prefix: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/finance-portal}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/finance-portal/protocol/openid-connect/certs}

app:
  logging:
    path: ${LOG_PATH:}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: finance-portal-backend

finnhub:
  enabled: true
  api:
    url: https://finnhub.io/api/v1
    key: ${FINNHUB_API_KEY:d7laeepr01qm7o0b5dt0d7laeepr01qm7o0b5dtg}
  sync:
    default-days-back: 3

news:
  providers:
    aa:
      enabled: true
      rss-url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
      default-category: ECONOMY
      default-language: tr
      default-region-scope: TR
    investing:
      enabled: true
      rss-url: ${INVESTING_RSS_URL:https://www.investing.com/rss/news_14.rss}
      default-category: ECONOMY
      default-language: en
      default-region-scope: GLOBAL
    kap:
      enabled: true
      base-url: https://www.kap.org.tr
      default-category: DISCLOSURE
      default-language: tr
      default-region-scope: TR
      max-items: 25

market:
  providers:
    yahoo:
      base-url: https://query1.finance.yahoo.com
      cookie: >-
        ${YAHOO_COOKIE}
      crumb: ${YAHOO_CRUMB}
    isyatirim:
      base-url: https://www.isyatirim.com.tr
    bist:
      base-url: https://datastore.borsaistanbul.com
  scheduler:
    futures-cron: "0 0 19 * * MON-FRI"
    bond-cron: "0 0 19 * * MON-FRI"
  cache:
    ttl-minutes:
      futures: 1500
      bond: 1500
