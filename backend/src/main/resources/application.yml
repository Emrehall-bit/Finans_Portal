spring:
  application:
    name: finance-portal-backend
  profiles:
    active: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financeportaldb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 86400000 # 24 saat (millisecond)
      key-prefix: "fp:cache:"
      use-key-prefix: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/finance-portal}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/finance-portal/protocol/openid-connect/certs}

app:
  logging:
    path: ${LOG_PATH:}

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: finance-portal-backend

news:
  startup-sync:
    enabled: true
  providers:
    aa:
      enabled: true
      feeds:
        - name: economy
          rss-url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
          default-category: ECONOMY
          relevance-threshold: 40
        - name: politics
          rss-url: https://www.aa.com.tr/tr/rss/default?cat=politika
          default-category: POLITICS
          relevance-threshold: 60
      default-language: tr
      default-region-scope: TR
    cnbc:
      enabled: true
      rss-url: ${CNBC_RSS_URL:https://www.cnbc.com/id/100003114/device/rss/rss.html}
      feed-urls:
        - ${CNBC_RSS_URL:https://www.cnbc.com/id/100003114/device/rss/rss.html}
      default-category: ECONOMY
      default-language: en
      default-region-scope: GLOBAL
    guardian:
      enabled: true
      base-url: https://content.guardianapis.com/search
      api-key: ${GUARDIAN_API_KEY:}
      default-category: ECONOMY
      default-language: en
      default-region-scope: GLOBAL
    kap:
      enabled: true
      scheduler-enabled: false
      scheduler-cron: "0 0 */2 * * *"
      base-url: https://www.kap.org.tr
      default-category: DISCLOSURE
      default-language: tr
      default-region-scope: TR
      max-results: 50
      lookback-days: 7
      startup-lookback-days: 30
      max-range-days: 90
      fetch-detail-enabled: true
      startup-sync-enabled: true
      disclosure-types:
        - ODA
        - FR
      member-types:
        - IGS
  notification:
    enabled: false
    min-importance-score: 70
  relations:
    mode: conservative
    legacy-enabled: false

market:
  providers:
    yahoo:
      base-url: https://query1.finance.yahoo.com
      cookie: >-
        ${YAHOO_COOKIE}
      crumb: ${YAHOO_CRUMB}
    isyatirim:
      base-url: https://www.isyatirim.com.tr
    bist:
      base-url: https://datastore.borsaistanbul.com
  scheduler:
    futures-cron: "0 0 19 * * MON-FRI"
    bond-cron: "0 0 19 * * MON-FRI"
  cache:
    ttl-minutes:
      futures: 1500
      bond: 1500
