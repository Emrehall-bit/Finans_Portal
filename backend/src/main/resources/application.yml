spring:
  application:
    name: finance-portal-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financeportaldb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  cache:
    type: redis
    redis:
      time-to-live: 86400000 # 24 saat (millisecond)
      key-prefix: "fp:cache:"
      use-key-prefix: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/finance-portal}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/finance-portal/protocol/openid-connect/certs}

logging:
  level:
    com.emrehalli.financeportal.market: DEBUG
    com.emrehalli.financeportal.market.provider.evds: DEBUG
    com.emrehalli.financeportal.news.provider.finnhub.client: DEBUG
    com.emrehalli.financeportal.news.provider.aa: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: finance-portal-backend

market:
  sources:
    tcmb-xml:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
      enabled: true
    tcmb-evds:
      url: https://evds2.tcmb.gov.tr/service/evds
      api-key: ${TCMB_EVDS_KEY:}
      enabled: false
    finnhub:
      url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_KEY:${FINNHUB_API_KEY:d7laeepr01qm7o0b5dt0d7laeepr01qm7o0b5dtg}}
      enabled: true
      stock-symbols: ["IS:THYAO","IS:GARAN","IS:AKBNK","IS:EREGL","IS:KCHOL"]
      commodity-symbols: ["OANDA:XAU_USD","OANDA:XAG_USD"]
    newsapi:
      url: https://newsapi.org/v2
      api-key: ${NEWS_API_KEY:}
      enabled: true

  scheduler:
    currency-cron: "0 */10 * * * *"
    stock-cron: "0 */10 * * * *"
    fund-cron: "0 0 18 * * *"

  cache:
    ttl:
      BINANCE: 20m
      BIST: 30m
      EVDS: 12h
      EVDS_MACRO: 12h
      TEFAS: 6h
      ALL: 10m

  provider-clients:
    bist:
      enabled: true
      provider-mode: YAHOO_LOW_FREQUENCY
      batch-size: 10
      request-delay-ms: 1500
      cooldown-minutes-on-rate-limit: 60
      yahoo:
        enabled: true
        base-url: https://query1.finance.yahoo.com
      delayed:
        enabled: false

    binance:
      enabled: true
      base-url: https://api.binance.com

    tefas:
      enabled: true
      base-url: https://www.tefas.gov.tr
      auth-token: "Bearer ST-tefaswebwse3irfmSBj4iRAzGPbAlS94Se"
      refresh-minutes: 360

    evds:
      enabled: true
      api:
        key: Rb7ROmhyOC
        url: https://evds3.tcmb.gov.tr/igmevdsms-dis
      history:
        scheduler-lookback-days: 7
        backfill-default-days: 365

    evds-macro:
      enabled: true
      api:
        key: ${TCMB_EVDS_KEY:Rb7ROmhyOC}
        base-url: https://evds3.tcmb.gov.tr/igmevdsms-dis
        macro-path: /fe
      history:
        scheduler-lookback-days: 31
        backfill-default-days: 365

  providers:
    circuit-breaker:
      sliding-window-size: 5
      failure-rate-threshold: 60
      wait-duration-open-state-seconds: 30
      permitted-calls-in-half-open-state: 2
      instances:
        evds_macro:
          sliding-window-size: 5
          failure-rate-threshold: 60
          wait-duration-open-state-seconds: 30
          permitted-calls-in-half-open-state: 2

  history:
    backfill:
      enabled: true
      min-data-points: 100
      interval-hours: 24
      default-lookback-days: 365

  refresh:
    initial-delay-ms: 0
    scheduler-delay-ms: 300000
    providers:
      bist:
        enabled: true
        refresh-minutes: 15
      binance:
        enabled: true
        refresh-minutes: 10
      evds:
        enabled: true
        refresh-minutes: 360
      evds_macro:
        enabled: true
        refresh-minutes: 360
      tefas:
        enabled: true
        refresh-minutes: 360

finnhub:
  enabled: true
  api:
    url: https://finnhub.io/api/v1
    key: ${FINNHUB_API_KEY:d7laeepr01qm7o0b5dt0d7laeepr01qm7o0b5dtg}
  sync:
    default-days-back: 3

news:
  providers:
    aa:
      enabled: true
      rss-url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
      default-category: ECONOMY
      default-language: tr
      default-region-scope: TR
    investing:
      enabled: true
      rss-url: ${INVESTING_RSS_URL:https://www.investing.com/rss/news_14.rss}
      default-category: ECONOMY
      default-language: en
      default-region-scope: GLOBAL
    kap:
      enabled: true
      base-url: https://www.kap.org.tr
      default-category: DISCLOSURE
      default-language: tr
      default-region-scope: TR
      max-items: 25